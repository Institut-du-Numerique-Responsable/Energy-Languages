name: Runner regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test runner with simulated RAPL readings
        run: python3 -m unittest discover -s tests -v
      - name: Build Linux RAPL backend
        run: make -B -C RAPL
