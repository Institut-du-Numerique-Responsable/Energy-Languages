name: Regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test runner, orchestration, analysis and website
        run: python3 -m unittest discover -s tests -v
      - name: Build Linux RAPL backend
        run: make -B -C RAPL
      - name: Verify reproducible numerical report
        run: |
          python3 scripts/analyze_results.py
          git diff --exit-code -- README.md docs/BENCHMARK_RESULTS.md docs/results
      - name: Build public website
        run: python3 scripts/build_site.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: runner
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
